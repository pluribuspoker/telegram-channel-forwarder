# Announce applied package updates to the watchdog chat once per daily
# unattended-upgrades run (silent when nothing was upgraded). Completes the
# update-notification family: reboot-class updates announce via
# auto-reboot.timer/reboot-if-required + boot-notify; this covers the
# library-class runs that only needrestart-bounce services.
# Script source of truth: deploy/sbin/update-notify in the app repo.
[Service]
ExecStartPost=/usr/local/sbin/update-notify
