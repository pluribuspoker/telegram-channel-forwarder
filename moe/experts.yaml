schema_version: 1
aggregator_policy:
  version: 1
  sigma_margin: 13.5
  sigma_total: 13.5
  shrink_lambda: 0.5
  edge_threshold: 0.03
  star_edges: [0.03, 0.05, 0.08, 0.12, 0.16]
  kelly_fraction: 0.25
  max_stake_fraction: 0.05
  veto_adverse_spread_points: 0.5
  veto_adverse_total_points: 1.0
  veto_adverse_price_cents: 10
  min_ev_per_unit: 0.02
  # normal: N(0, sigma) residuals. empirical: moe/priors/nfl_margins_v1.json
  # (scripts/build_nfl_margins.py), normal off its support. Flip between weeks.
  margin_model: normal
  voice_rule: default_model
  voice_fallback: latest_any_model
  hedge_eta: 2.0
  weights_min_resolved: 3
  weight_floor: 0.5
  weight_cap: 2.0
  factor_limit: 5
  factor_chars: 200
  reason_limit: 6
  reason_chars: 280
experts:
  schedule:
    name: Schedule Expert
    mode: agent
    version: 27
    prompt_version: 15
    prompt: prompts/schedule/v15.md
    input_profile: schedule_only
    output_schema_version: 6
    default_model: claude-opus-4-8
    reasoning_effort: max
    model_reasoning_effort:
      claude-fable-5: medium
      claude-sonnet-4-6: max
      claude-haiku-4-5: max
    model_prompts:
      claude-haiku-4-5:
        prompt_version: 1
        prompt: prompts/schedule_haiku/v1.md
        output_schema_version: 3
    allowed_models:
      - claude-opus-4-8
      - claude-fable-5
      - claude-sonnet-4-6
      - claude-haiku-4-5
    enabled: true
    initial_weight: 1.0
    markets: [side, total]
  divisional:
    name: Divisional Expert
    mode: agent
    version: 34
    prompt_version: 20
    prompt: prompts/divisional/v20.md
    input_profile: divisional
    output_schema_version: 4
    default_model: claude-opus-4-8
    reasoning_effort: max
    model_reasoning_effort:
      claude-fable-5: medium
      claude-sonnet-4-6: max
      claude-haiku-4-5: max
    model_prompts:
      claude-haiku-4-5:
        prompt_version: 1
        prompt: prompts/divisional_haiku/v1.md
        output_schema_version: 7
    allowed_models:
      - claude-opus-4-8
      - claude-fable-5
      - claude-sonnet-4-6
      - claude-haiku-4-5
    enabled: true
    initial_weight: 1.0
    markets: [side]
  win_total:
    name: Win Total Expert
    mode: agent
    version: 5
    prompt_version: 5
    prompt: prompts/win_total/v5.md
    input_profile: win_total
    output_schema_version: 3
    default_model: claude-opus-4-8
    reasoning_effort: max
    allowed_models:
      - claude-opus-4-8
    enabled: true
    initial_weight: 1.0
    markets: [side]
  ak:
    name: AK Expert
    mode: human_calibration
    version: 2
    prompt_version: 1
    prompt: prompts/ak/v1.md
    input_profile: ak_calibration
    output_schema_version: 5
    default_model: claude-opus-4-8
    reasoning_effort: max
    allowed_models:
      - claude-opus-4-8
    enabled: true
    initial_weight: 1.0
    markets: [side, total]
  cee:
    name: Cee Expert
    mode: agent
    version: 1
    prompt_version: 1
    prompt: prompts/cee/v1.md
    input_profile: cee_calibration
    output_schema_version: 3
    default_model: claude-opus-4-8
    reasoning_effort: max
    model_reasoning_effort:
      claude-fable-5: medium
      claude-sonnet-4-6: max
      claude-haiku-4-5: max
    allowed_models:
      - claude-opus-4-8
      - claude-fable-5
      - claude-sonnet-4-6
      - claude-haiku-4-5
    enabled: true
    committee_optional: true
    initial_weight: 1.0
    markets: [side]
  celebrity:
    name: Celebrity Expert
    mode: agent
    version: 2
    prompt_version: 2
    prompt: prompts/celebrity/v2.md
    input_profile: celebrity_patterns
    output_schema_version: 5
    default_model: claude-opus-4-8
    reasoning_effort: max
    allowed_models:
      - claude-opus-4-8
    enabled: true
    committee_optional: true
    initial_weight: 1.0
    markets: [side, total]
  rating_elo:
    name: Rating Expert (Elo)
    mode: model
    version: 1
    prompt_version: 1
    prompt: prompts/rating_elo/v1.md
    input_profile: rating
    output_schema_version: 9
    default_model: deterministic
    allowed_backends:
      - deterministic
    # Side only: its projected total is the league scoring rate, no signal.
    markets: [side]
    # Approved at generation, hash-bound: the response is arithmetic checked
    # against the input's own estimate (decided 2026-09-07). Only mode: model
    # experts may declare this; every other expert keeps the human gate.
    review: validation
    enabled: true
    initial_weight: 1.0
  god_rules:
    name: God Expert (Rules)
    mode: aggregator
    version: 2
    prompt_version: 2
    prompt: prompts/god_rules/v2.md
    input_profile: aggregator
    output_schema_version: 8
    allowed_backends:
      - deterministic
    enabled: true
  god_judge:
    name: God Expert (Judge)
    mode: aggregator_judge
    version: 2
    prompt_version: 2
    prompt: prompts/god_judge/v2.md
    input_profile: aggregator
    output_schema_version: 8
    default_model: claude-fable-5-1
    reasoning_effort: max
    allowed_models:
      - claude-fable-5-1
    allowed_backends:
      - agent_runtime
      - claude_headless
    enabled: true
